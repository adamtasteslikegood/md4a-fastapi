name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q

  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the package without extras
        run: python -m pip install --upgrade pip && python -m pip install . pytest
      - name: Check the server dependencies are not installed
        run: >-
          python -c "import importlib.util, sys;
          found = [m for m in ('httpx', 'uvicorn') if importlib.util.find_spec(m)];
          sys.exit(f'server dependencies installed: {found}' if found else 0)"
      - name: Run the WSGI middleware tests
        run: python -m pytest -q tests/test_wsgi.py
      - name: Check the md4a command names the server extra
        run: md4a fetch https://example.com/ 2>&1 | grep -F "md4a-fastapi[server]"

  package:
    name: Build package
    needs: [lint, test, base-install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build && python -m build meta/md4a --outdir dist
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
