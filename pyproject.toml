[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "md4a"
version = "0.1.0"
description = "Markdown-for-Agents discovery, storage, and FastAPI middleware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdownify>=0.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
md4a = "md4a.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

