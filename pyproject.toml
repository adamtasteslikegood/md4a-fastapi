[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "md4a-fastapi"
dynamic = ["version"]
description = "Markdown for Agents content negotiation for FastAPI, Flask, and other WSGI apps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "ai", "asgi", "fastapi", "flask", "markdown", "wsgi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
# The base install is what the middlewares need. FastAPI stays in it because the
# distribution is named for it; the WSGI middleware never imports it.
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "markdownify>=0.14,<2",
]

[project.optional-dependencies]
# Remote discovery client, standalone service, and the md4a command.
server = [
  "anyio>=3.6.2,<5",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]
# The WSGI middleware needs nothing beyond the base install. These names exist so
# "md4a-fastapi[flask]" documents intent and keeps working if that ever changes.
flask = []
wsgi = []
test = [
  "md4a-fastapi[server]",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "trio>=0.25,<1",
]

[project.scripts]
md4a = "md4a.cli:main"

[project.urls]
Documentation = "https://github.com/adamtasteslikegood/md4a-fastapi#readme"
Issues = "https://github.com/adamtasteslikegood/md4a-fastapi/issues"
Repository = "https://github.com/adamtasteslikegood/md4a-fastapi"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "md4a/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/md4a", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["md4a"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
